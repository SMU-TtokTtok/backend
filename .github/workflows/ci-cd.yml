name: Deploy master

# EB → 자체 서버 이관 (#354)
#   - runs-on: ubuntu-latest → self-hosted (이 서버에서 러너가 돈다)
#   - Elastic Beanstalk 관련 전부 제거 (Procfile, .platform, zip, beanstalk-deploy)
#   - 시크릿은 이미지에 굽지 않고 /opt/ttokttok/config/app 에 배치해 런타임 마운트
#   - docker build 후 deploy.sh 로 블루-그린 무중단 전환
#
# 러너 워크스페이스는 actions/checkout 이 매 실행마다 정리하므로, 운영 스택
# (compose, .env, data)은 워크스페이스가 아니라 $TTOK_ROOT 아래에 있다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 동시 배포는 색 전환 상태(state 파일)를 망가뜨린다. 큐잉하되 취소하지 않는다.
concurrency:
  group: ttokttok-deploy
  cancel-in-progress: false

env:
  TTOK_ROOT: /opt/ttokttok

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # JDK/Gradle 세팅은 필요 없다. 빌드는 Dockerfile 안(멀티스테이지)에서 일어난다.

      - name: Materialize secrets into runtime config directory
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}
          APPLICATION_PROD_YAML: ${{ secrets.APPLICATION_PROD_YAML }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIREBASE_JSON_NAME: ${{ secrets.FIREBASE_JSON_NAME }}
        run: |
          set -euo pipefail
          CONF="$TTOK_ROOT/config/app"

          [ -n "$APPLICATION_YML" ]       || { echo "::error::APPLICATION_YML secret is empty!"; exit 1; }
          [ -n "$APPLICATION_PROD_YAML" ] || { echo "::error::APPLICATION_PROD_YAML secret is empty!"; exit 1; }

          # 컨테이너가 /app/config 로 읽는 위치. Spring Boot 가 ./config/ 를 기본 설정
          # 탐색 경로에 포함하므로(WORKDIR=/app) 별도 옵션 없이 읽힌다.
          # .dockerignore 가 이 파일들을 빌드 컨텍스트에서 제외하므로 이미지에는 없다.
          #
          # envsubst 를 쓰지 않는다. DB/Redis/메일 자격증명은 compose 환경변수로
          # 주입되므로 yml 에 치환할 플레이스홀더가 남아있지 않고, 인자 없는 envsubst 는
          # 값 안의 모든 $VAR 를 치환하면서 정의되지 않은 것은 빈 문자열로 지워버린다.
          # 비밀번호에 $ 가 하나만 들어가도 값이 조용히 잘린다.
          #
          # 파일을 직접 덮어쓰지 않고 임시 파일에 쓴 뒤 rename 으로 갈아끼운다.
          # config/app 은 이 트리에서 쓰는 주체(러너 ttokttok-cicd)와 읽는 주체
          # (앱 ttokttokuser)가 다른 유일한 위치인데, setup.sh 가 $ROOT 전체를
          # ttokttokuser 로 chown 하므로 그 뒤로 러너는 소유자가 아니게 된다.
          #   - `>` 는 unlink 가 아니라 truncate 라서 파일 쓰기 권한이 필요하고
          #   - chmod 는 모드와 무관하게 소유자만 할 수 있다
          # 그래서 덮어쓰기 방식은 setup.sh 를 재실행하는 순간 배포가 깨진다.
          # 반면 rename 은 디렉터리 쓰기 권한만 요구하고, 러너는 그룹(ttokttok)
          # 자격으로 그걸 항상 갖는다. 새로 만든 임시 파일은 러너 소유라 chmod 도
          # 되고, 교체가 원자적이라 앱이 반쯤 쓰인 설정을 읽을 위험도 없다.
          place() {   # place <대상경로> : stdin 을 받아 원자적으로 배치한다
            local dest="$1" tmp
            tmp="$(mktemp "$(dirname "$dest")/.tmp.XXXXXXXX")"
            if cat > "$tmp" && chmod 640 "$tmp" && mv -f "$tmp" "$dest"; then
              return 0
            fi
            rm -f "$tmp"        # 시크릿이 담긴 잔재를 남기지 않는다
            return 1
          }

          echo "$APPLICATION_YML"       | tr -d '\n' | base64 --decode | place "$CONF/application.yml"
          echo "$APPLICATION_PROD_YAML" | tr -d '\n' | base64 --decode | place "$CONF/application-prod.yml"

          if [ -n "$FIREBASE_JSON" ] && [ -n "$FIREBASE_JSON_NAME" ]; then
            echo "$FIREBASE_JSON" | tr -d '\n' | base64 --decode | place "$CONF/$FIREBASE_JSON_NAME"
            echo "Firebase JSON 배치 완료"
          else
            echo "::warning::FIREBASE_JSON 시크릿 없음 — 건너뜀"
          fi

      - name: Build image
        id: image
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"
          docker build -t "ttokttok:$TAG" .
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Blue-green deploy
        run: $TTOK_ROOT/app/deploy.sh "${{ steps.image.outputs.tag }}"

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.SERVICE_DOMAIN }}
        run: |
          set -euo pipefail
          # 이름 해석은 공개 리졸버에 직접 묻고, 그 IP 로 --resolve 한다.
          #
          # 확인하려는 것은 "공개된 서비스가 실제로 200 을 주는가" 이지 "러너가 도는
          # 이 PC 가 이름을 풀 수 있는가" 가 아니다. 그런데 이 PC 의 systemd-resolved
          # 업스트림 두 개 중 하나가 SERVFAIL 을 내고 있어서, 캐시가 만료된 순간에
          # 걸리면 배포가 멀쩡히 끝났는데도 curl 이 종료코드 6(Could not resolve host)
          # 으로 죽는다. 실제로 그렇게 실패한 적이 있다. 검증 대상이 아닌 것이
          # 실패 지점으로 들어와 있으면 진짜 실패를 가린다.
          #
          # 공개 DNS → 공유기 → nginx → 앱 경로는 그대로 검증된다.
          # dig 의존성을 늘리지 않으려고 DoH 를 쓴다(curl 은 어차피 쓴다).
          ip=""
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
            ip="$(curl -fsS --max-time 6 -H 'accept: application/dns-json' \
                    "https://${r}/dns-query?name=${DOMAIN}&type=A" 2>/dev/null \
                  | grep -oE '"data":"[0-9]{1,3}(\.[0-9]{1,3}){3}"' | tail -1 | cut -d'"' -f4)" || true
            [ -n "$ip" ] && break
          done
          [ -n "$ip" ] || { echo "::error::공개 DNS 가 $DOMAIN 의 A 레코드를 돌려주지 않는다"; exit 1; }
          echo "공개 DNS 해석: $DOMAIN → $ip"

          # 이 앱에는 actuator 의존성이 없다. /health 가 공개 헬스 엔드포인트다.
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     --resolve "${DOMAIN}:443:${ip}" "https://${DOMAIN}/health")
            [ "$code" = "200" ] || { echo "예상 200, 실제 $code"; exit 1; }
            sleep 1
          done
          echo "스모크 테스트 통과"
