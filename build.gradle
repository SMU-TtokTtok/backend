plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'org.project.ttokttok'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// spring boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// spring data
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//h2
	runtimeOnly 'com.h2database:h2'

	//postgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Google ID 토큰 검증 (JWKS 기반, resource-server 스타터는 필터체인 오염 방지를 위해 미사용)
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	//Querydsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	//swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// JsonNullable
	implementation 'org.openapitools:jackson-databind-nullable:0.2.4'

	// AWS S3
	implementation 'software.amazon.awssdk:s3:2.25.61'

	// Excel
	implementation 'org.apache.poi:poi-ooxml:5.2.2'
	implementation 'org.apache.poi:poi:5.2.2'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.1'

	// Actuator + Prometheus 메트릭 노출
	// load-test/prometheus.yml 이 /actuator/prometheus 를 스크레이프하도록 이미 설정돼 있으나
	// 그동안 이 의존성이 없어 엔드포인트 자체가 존재하지 않았다(404).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// ShedLock — 다중 인스턴스(블루-그린) 환경에서 @Scheduled 중복 실행 방지.
	// 락 저장소로 이미 사용 중인 Redis 를 그대로 쓴다(신규 인프라 불필요).
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.16.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.12"
}

// 커버리지 측정에서 제외할 항목 (생성 코드/보일러플레이트/설정)
def jacocoExcludes = [
		'**/Q*.class',                 // QueryDSL 생성 클래스
		'**/*Application*',            // 스프링 부트 진입점
		'**/dto/**',                   // 요청/응답 DTO
		'**/*Request*',
		'**/*Response*',
		'**/*QueryResponse*',
		'**/docs/**',                  // Swagger 문서 인터페이스
		'**/*Docs*',
		'**/config/**',                // 설정 클래스
		'**/*Config*',
		'**/enums/**',                 // enum
		'**/exception/**',             // 커스텀 예외(로직 없음)
]

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

// 80% 라인 커버리지 하드 게이트: check(= build) 시 검증을 강제한다.
check.dependsOn jacocoTestCoverageVerification
