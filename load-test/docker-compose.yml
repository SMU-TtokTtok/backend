version: "3.8"

# Base infrastructure: App, DB, Redis, Nginx
# Add monitoring with: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Add k6 with: docker compose -f docker-compose.yml -f docker-compose.k6.yml run --rm k6 ...

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ttokttok

  app:
    build:
      context: ..
      dockerfile: load-test/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=loadtest
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ttokttok
      - SPRING_DATASOURCE_USERNAME=ttokttok_user
      - SPRING_DATASOURCE_PASSWORD=ttokttok_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - JAVA_OPTS=-Xms1g -Xmx1g -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - ttokttok

  db:
    image: postgres:17.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ttokttok
      - POSTGRES_USER=ttokttok_user
      - POSTGRES_PASSWORD=ttokttok_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttokttok_user -d ttokttok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ttokttok

  redis:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ttokttok

volumes:
  postgres_data:
  redis_data:

networks:
  ttokttok:
    driver: bridge
