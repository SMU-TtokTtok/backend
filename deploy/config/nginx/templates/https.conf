# 2단계: 인증서 발급 완료 후. 80 은 ACME/헬스만 남기고 전부 443 리다이렉트.

# ── API 도메인 ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAMES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    client_max_body_size __MAX_BODY__;

    # 컨테이너가 없는 색을 가리켜도 nginx 가 죽지 않도록, 이름 해석을 요청 시점으로 미룬다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/upstream.conf;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

# ── 파일 도메인 (구 CloudFront) ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __FILE_SERVER_NAMES__;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __FILE_SERVER_NAMES__;

    ssl_certificate     /etc/letsencrypt/live/__FILE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FILE_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/conf.d/minio-public.inc;
    }
}
