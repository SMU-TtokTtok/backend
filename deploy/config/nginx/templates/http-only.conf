# 1단계: 인증서 발급 전. ACME 챌린지를 받기 위해 80 만 연다.
# bin/nginx-apply.sh 가 __PLACEHOLDER__ 를 .env 값으로 치환해 conf.d/ttokttok.conf 로 설치한다.

# ── API 도메인 ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    client_max_body_size __MAX_BODY__;

    # 컨테이너가 없는 색을 가리켜도 nginx 가 죽지 않도록, 이름 해석을 요청 시점으로 미룬다.
    # (Docker 내장 DNS. 이것이 없으면 기동 시 "host not found in upstream" 으로 실패한다)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/upstream.conf;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

# ── 파일 도메인 (구 CloudFront) ──────────────────────────────────────────
# DB 에 저장된 공개 URL 형식(https://<파일도메인>/<key>)을 그대로 유지하기 위해
# 버킷 이름을 nginx 가 붙여준다. CloudFront 가 하던 역할과 동일하다.
server {
    listen 80;
    listen [::]:80;
    server_name __FILE_SERVER_NAMES__;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /etc/nginx/conf.d/minio-public.inc;
    }
}
